name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Change this to 'development' if you want to deploy from development branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for deployment
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Since this is a static site, we don't need Node.js setup and build steps
      # If you add any build steps later, you can uncomment these
      # - name: Setup Node.js
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: '18'

      # - name: Install dependencies
      #   run: npm ci

      # - name: Build
      #   run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . # Deploy the root folder
          branch: main # Deploy to main branch
          clean: true # Automatically remove deleted files from the deployment
